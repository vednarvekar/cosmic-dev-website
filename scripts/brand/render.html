<!doctype html>
<!--
  Brand asset templates for vednarvekar.com. Not part of the site build.
  Open with the dev server running:
    /scripts/brand/render.html?asset=og                 -> 1200x630 social card
    /scripts/brand/render.html?asset=icon&size=180      -> full-bleed square icon
    /scripts/brand/render.html?asset=maskable&size=512  -> icon with maskable safe zone
  Then screenshot the #stage element at its exact size (see scripts/brand/README.md).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>brand render</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wdth,wght@75..125,500;75..125,800;75..125,900&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
<style>
  :root { --paper:#f3f1ea; --dot:#dcd8cb; --ink:#17180f; --olive:#23241a; --lime:#d4ff3a; --mute:#7a7b6c; --yellow:#ffe680; --pink:#ffc9d6; --blue:#bfe0ff; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #888; }
  #stage { position: relative; overflow: hidden; }

  /* ---------- icon ---------- */
  .icon { background: var(--ink); display: grid; place-items: center; }
  .icon svg { display: block; }

  /* ---------- OG card ---------- */
  .og { width: 1200px; height: 630px; background: var(--paper); background-image: radial-gradient(var(--dot) 1.6px, transparent 1.6px); background-size: 26px 26px; font-family: "Archivo", sans-serif; color: var(--ink); }
  .og .copy { position: absolute; left: 72px; top: 70px; width: 700px; }
  .og .hi { font-family: "Caveat", cursive; font-size: 46px; color: var(--mute); transform: rotate(-3deg); display: inline-block; }
  .og h1 { font-weight: 900; font-stretch: 75%; text-transform: uppercase; font-size: 150px; line-height: .8; letter-spacing: -.045em; margin-top: 6px; }
  .og h1 em { font-family: "Instrument Serif", serif; font-weight: 400; text-transform: none; letter-spacing: -.02em; display: block; }
  .og p { font-size: 28px; line-height: 1.3; color: #3f4034; margin-top: 22px; max-width: 620px; }
  .og p mark { background: var(--lime); color: inherit; padding: 0 .15em; }
  .og .url { position: absolute; left: 72px; bottom: 46px; font-family: "JetBrains Mono", monospace; font-size: 22px; background: var(--ink); color: var(--lime); padding: 12px 20px; border-radius: 999px; }
  .og .url b { color: #f3f1ea; font-weight: 400; }

  .og .obj { position: absolute; box-shadow: 0 12px 30px #0002; }
  .og .sticky { width: 250px; padding: 22px 20px; font-family: "Caveat", cursive; font-size: 33px; line-height: 1.02; }
  .og .sticky small { display: block; font-family: "JetBrains Mono", monospace; font-size: 13px; text-transform: uppercase; opacity: .6; margin-bottom: 8px; }
  .og .sticky::before { content: ""; position: absolute; top: -13px; left: 50%; width: 84px; height: 26px; transform: translateX(-50%) rotate(-3deg); background: #fff9; border: 1px solid #0001; }
  .og .term { width: 360px; background: var(--ink); color: #c9ccb6; border-radius: 14px; font-family: "JetBrains Mono", monospace; font-size: 17px; line-height: 1.6; overflow: hidden; }
  .og .term .tb { display: flex; gap: 8px; padding: 12px 14px; background: #2b2c22; }
  .og .term .tb i { width: 12px; height: 12px; border-radius: 50%; background: #4a4c3c; }
  .og .term pre { font-family: inherit; padding: 14px 18px 16px; white-space: pre-wrap; }
  .og .term b { color: var(--lime); font-weight: 400; }
  .og .disk { width: 170px; aspect-ratio: 1; border-radius: 10px; clip-path: polygon(0 0, 92% 0, 100% 8%, 100% 100%, 0 100%); box-shadow: none; }
  .og .disk .sh { position: absolute; top: 0; left: 22%; width: 52%; height: 30%; background: #c9c9c4; border-radius: 0 0 5px 5px; }
  .og .disk .sh::after { content: ""; position: absolute; right: 16%; top: 16%; width: 18%; height: 62%; background: var(--ink); opacity: .8; }
  .og .disk .lb { position: absolute; left: 9%; right: 9%; bottom: 8%; height: 52%; background: #fff; border-radius: 5px; padding: 12px; font-family: "Caveat", cursive; font-size: 32px; font-weight: 700; display: grid; align-content: center; }
  .og .lights { display: flex; gap: 9px; background: var(--ink); padding: 11px 14px; border-radius: 10px; }
  .og .lights i { width: 24px; height: 24px; border-radius: 50%; background: #ff2b2b; box-shadow: 0 0 14px #ff2b2b; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  const q = new URLSearchParams(location.search);
  const asset = q.get('asset') || 'og';
  const stage = document.getElementById('stage');
  // same geometry as public/favicon.svg, drawn without the tile so we can size the V freely
  const V = '<path d="M13 13h12.5L32 38.5 38.5 13H51L39.5 51h-15z" fill="#d4ff3a"/>';

  if (asset === 'icon' || asset === 'maskable') {
    const size = +(q.get('size') || 512);
    // maskable icons must keep content inside the centre 80% circle
    const glyph = Math.round(size * (asset === 'maskable' ? 0.62 : 0.86));
    stage.className = 'icon';
    stage.style.width = stage.style.height = size + 'px';
    stage.innerHTML = `<svg width="${glyph}" height="${glyph}" viewBox="0 0 64 64">${V}</svg>`;
  } else {
    stage.className = 'og';
    stage.innerHTML = `
      <div class="copy">
        <span class="hi">hey there, I'm</span>
        <h1>Ved <em>Narvekar</em></h1>
        <p>DevOps &amp; AI engineer building <mark>infra that doesn't break</mark> and AI that knows when it's wrong.</p>
      </div>
      <div class="url"><b>→</b> vednarvekar.com</div>
      <div class="obj disk" style="left:820px; top:316px; transform:rotate(-9deg); background:#d4ff3a"><div class="sh"></div><div class="lb">jitmo</div></div>
      <div class="obj disk" style="left:968px; top:372px; transform:rotate(7deg); background:#bfe0ff"><div class="sh"></div><div class="lb">gateway</div></div>
      <div class="obj term" style="left:790px; top:120px; transform:rotate(2deg)"><div class="tb"><i></i><i></i><i></i></div><pre><b>~$</b> whoami
devops &amp; ai engineer
<b>~$</b> cat stack.txt
aws · azure devops · docker</pre></div>
      <div class="obj sticky" style="left:900px; top:28px; transform:rotate(5deg); background:#ffe680"><small>status</small>shipping AI automation @ JDAS ✦</div>
      <div class="obj lights" style="left:770px; top:540px; transform:rotate(-3deg)"><i></i><i></i><i></i><i></i><i></i></div>`;
  }
</script>
</body>
</html>
